<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
function svg(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(parent)parent.append(e);return e}
function rect(p,x,y,w,h,fill,extra={}){return svg('rect',{x,y,width:w,height:h,fill,...extra},p)}
function text(p,x,y,value,size=12,fill='#33445a'){const t=svg('text',{x,y,'font-size':size,fill,'text-anchor':'middle','font-family':'Microsoft YaHei, sans-serif'},p);t.textContent=value;return t}
const allowDemo=window.OFFICE_CONFIG?.allow_demo===true;
let hasLiveData=false;
function beijingTime(value,includeDate=true){
 const date=new Date(value);if(value===null||value===undefined||value===''||!Number.isFinite(date.getTime()))return '未上报';
 const formatter=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const parts=Object.fromEntries(formatter.formatToParts(date).map(p=>[p.type,p.value]));
 const clock=parts.hour+':'+parts.minute+':'+parts.second;return includeDate?parts.year+'-'+parts.month+'-'+parts.day+' '+clock:clock;
}
function lockLiveData(){
 hasLiveData=true;if(mode==='demo'){mode='live';agents=[];selected=null;services.clear();scheduleRuns.clear();$('people').replaceChildren();$('routes').replaceChildren();$('scheduleToasts').replaceChildren();$('inspector').hidden=true;renderServers();renderSchedules();}
 modeUI();
}
const reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
let capacity=6,rows=2,height=680,obstacles=[],seats=[],agents=[],selected=null,mode='live',showPaths=true,paused=false,lastTime=0,lastSeq=0,source=null,reconnect=null;
const labels={writing:'打字中',executing:'执行任务',researching:'查阅资料',thinking:'思考中',anxious:'着急',blocked:'为难',done:'完成 · 开心',idle:'等待',resting:'沙发休息',walking:'行走',syncing:'同步资料',receiving:'接收任务',replying:'回复中',error:'任务异常'};
const palette=['#6499b6','#db9a61','#8fa870','#ad85ad','#d77f80','#7baaaa'];
// Visual-only colleagues live outside the actual agent roster and never write events.
let ambient=[],ambientEnabled=true,ambientRefreshAt=0,ambientLoadBucket=-1;
const BOSS_INTERVAL_MS=45*60*1000;
let bossPatrol=null,nextBossPatrolAt=Date.now()+BOSS_INTERVAL_MS;
const bossClockKey='office-boss-next:'+String(window.location?.pathname||'/town');
try{const saved=Number(window.localStorage?.getItem(bossClockKey));if(saved>0)nextBossPatrolAt=saved;else window.localStorage?.setItem(bossClockKey,String(nextBossPatrolAt));}catch{}
function visibleActors(){return [...actors(),...(bossPatrol?[bossPatrol.boss]:[])]}
function bossDoor(){return {x:660,y:height-20}}
function moveAlong(actor,route,dt,speed=100){if(!route.length)return true;const point=route[0],dx=point.x-actor.x,dy=point.y-actor.y,distance=Math.hypot(dx,dy),step=speed*dt;if(distance<=step){actor.x=point.x;actor.y=point.y;route.shift()}else if(distance){actor.x+=dx/distance*step;actor.y+=dy/distance*step}return !route.length}
function releaseBossTarget(returnToWork=false){if(!bossPatrol)return;const target=actors().find(a=>a.id===bossPatrol.targetId);if(target){target.patrolHold=false;target.patrolIcon=null;target.combatHP=null;target.combatParticipant=false;target.fighting=false;target.hitRemaining=0;if(returnToWork)destination(target,target.ambient?'wander':target.state==='researching'?'library':'desk');}const boss=bossPatrol.boss;boss.patrolIcon=null;boss.combatHP=null;boss.combatParticipant=false;boss.fighting=false;boss.hitRemaining=0;$('officeMapShell')?.classList.remove?.('combat-shake');}
function stopBossPatrol(){if(!bossPatrol)return;releaseBossTarget(Boolean(bossPatrol.fighterMoved));bossPatrol.boss.node?.remove();if(selected===bossPatrol.boss.id){selected=null;$('inspector').hidden=true;}bossPatrol=null;}
function startBossPatrol(now=Date.now()){
 if(bossPatrol||!hasLiveData||mode!=='live'||!agents.length)return false;
 const staff=actors();if(!staff.length)return false;const entry=bossDoor();

function passable(x,y){return x>=20&&y>=40&&x<=980&&y<=height-20&&!obstacles.some(o=>x>o.x-10&&x<o.x+o.w+10&&y>o.y-10&&y<o.y+o.h+10)}
function nearest(point){let best=null,dist=Infinity;for(let y=40;y<=height-20;y+=10)for(let x=20;x<=980;x+=10){if(!passable(x,y))continue;const d=Math.abs(x-point.x)+Math.abs(y-point.y);if(d<dist){dist=d;best={x,y}}}return best}
function findPath(start,target){const a=nearest(start),b=nearest(target);if(!a||!b)return [];const key=p=>p.x+','+p.y,q=[a],seen=new Map([[key(a),null]]);let end=null;for(let i=0;i<q.length;i++){const p=q[i];if(key(p)===key(b)){end=p;break}for(const [dx,dy]of [[10,0],[-10,0],[0,10],[0,-10]]){const n={x:p.x+dx,y:p.y+dy},k=key(n);if(passable(n.x,n.y)&&!seen.has(k)){seen.set(k,p);q.push(n)}}}if(!end)return [];const result=[];while(end){result.push(end);end=seen.get(key(end))}return result.reverse()}

function updateWallClock(now){const time=beijingTime(now,false);$('map-clock').textContent=time;$('wall-clock').setAttribute('aria-label','北京时间 '+time);const [h,m,sec]=time.split(':').map(Number);for(const [id,angle]of [['clock-hour',(h%12)*30+m/2],['clock-minute',m*6+sec/10],['clock-second',sec*6]])$(id).setAttribute('transform',`rotate(${angle} 948 43)`);}

function renderFloorBooks(){const readers=actors().filter(a=>a.destination==='library'&&!a.path.length&&!a.offDuty&&!a.patrolHold&&!a.socialOwner);const signature=readers.map(a=>a.id+':'+Math.round(a.x)+':'+Math.round(a.y)).sort().join('|');const root=$('floor-books');if(signature===floorBooksSignature&&root.children.length===readers.length)return;floorBooksSignature=signature;root.replaceChildren();for(const a of readers){const group=svg('g',{'data-reader':a.id},root);const titles=floorBookTitles.slice().sort(()=>Math.random()-.5);for(let i=0;i<3;i++){const x=Math.max(731,Math.min(920,a.x+[-69,55,18][i])),y=Math.max(217,Math.min(height-240,a.y+[0,10,32][i]));const book=svg('g',{transform:`translate(${x} ${y}) rotate(${[-12,13,-5][i]} 24 11)`},group);rect(book,2,3,51,23,'#354954',{opacity:.2});rect(book,0,0,51,23,['#668f86','#6f839e','#a77c54'][i],{stroke:'#3f5459','stroke-width':1});rect(book,3,20,46,2,'#f4e7c8');rect(book,3,2,2,17,'#d9c89d');text(book,28,14,titles[i],titles[i].length>9?6.2:8,'#fff4d5');svg('title',{},book).textContent=titles[i];}}}
