<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
function svg(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(parent)parent.append(e);return e}
function rect(p,x,y,w,h,fill,extra={}){return svg('rect',{x,y,width:w,height:h,fill,...extra},p)}
function text(p,x,y,value,size=12,fill='#33445a'){const t=svg('text',{x,y,'font-size':size,fill,'text-anchor':'middle','font-family':'Microsoft YaHei, sans-serif'},p);t.textContent=value;return t}
const reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
let capacity=6,rows=2,height=680,obstacles=[],seats=[],agents=[],selected=null,mode='live',showPaths=true,paused=false,lastTime=0,lastSeq=0,source=null,reconnect=null;
const labels={writing:'打字中',executing:'执行任务',researching:'查阅资料',thinking:'思考中',anxious:'着急',blocked:'为难',done:'完成 · 开心',idle:'等待',resting:'沙发休息',walking:'行走',syncing:'同步资料',receiving:'接收任务',replying:'回复中',error:'任务异常'};
const palette=['#6499b6','#db9a61','#8fa870','#ad85ad','#d77f80','#7baaaa'];
function block(x,y,w,h){obstacles.push({x,y,w,h})}
function plant(p,x,y){rect(p,x-11,y,22,18,'#a97859');rect(p,x-15,y-4,30,6,'#d6af87');for(const [dx,dy]of [[-12,-25],[0,-34],[10,-23],[-4,-17]]){rect(p,x+dx-6,y+dy,13,18,'#4c7956');rect(p,x+dx-3,y+dy,5,13,'#81a365')}block(x-20,y-40,40,60)}
function rebuild(){
 rows=Math.ceil(capacity/3);height=rows*160+360;obstacles=[];seats=[];
 $('map').setAttribute('viewBox',`0 0 1000 ${height}`);for(const id of ['room','furniture','routes','people','servers'])$(id).replaceChildren();
 const room=$('room'),f=$('furniture');rect(room,0,0,700,height,'url(#wood)');rect(room,700,0,300,height,'url(#tile)');
 const door=250;rect(room,695,0,10,door-35,'#586b7b');rect(room,695,door+35,10,height-door-35,'#586b7b');block(695,0,10,door-35);block(695,door+35,10,height-door-35);
 text(room,350,27,'WORKSPACE / 工作与协作',13);text(room,850,27,'RESOURCE / 资料与服务',12);
 for(let i=0;i<capacity;i++){const x=40+(i%3)*215,y=80+Math.floor(i/3)*160;seats.push({x:x+80,y:y+35});block(x,y+48,160,64);rect(f,x+64,y+22,35,30,'#687887');rect(f,x,y+48,160,64,'#825a40');rect(f,x+3,y+48,154,53,'#d5a36e');rect(f,x+12,y+111,7,14,'#675245');rect(f,x+142,y+111,7,14,'#675245');rect(f,x+45,y+39,70,39,'#293c52');rect(f,x+49,y+43,62,30,'#617f93');rect(f,x+76,y+78,8,8,'#3c4f60');rect(f,x+55,y+88,56,8,'#e8d9b4');text(f,x+80,y+109,'工位 '+String(i+1).padStart(2,'0'),9);}
 const lounge=height-115;rect(f,35,lounge-20,290,100,'#eadfc2');rect(f,42,lounge-13,276,86,'none',{stroke:'#849779','stroke-dasharray':'4 3','stroke-width':3});rect(f,75,lounge-5,185,60,'#4b7556');rect(f,84,lounge+4,167,40,'#83a172');rect(f,71,lounge+8,18,49,'#638660');rect(f,247,lounge+8,18,49,'#638660');block(70,lounge-8,200,68);plant(f,45,lounge+55);plant(f,305,lounge+55);
 for(let i=0;i<2;i++){const x=735+i*120;rect(f,x,65,105,135,'#785640');rect(f,x+6,70,93,122,'#c49d73');for(let r=0;r<3;r++){for(let b=0;b<7;b++)rect(f,x+10+b*12,78+r*37,8,26,['#5c889b','#b67659','#85986e'][b%3]);rect(f,x+5,107+r*37,95,5,'#785640')}block(x,65,105,135)}
 for(let i=0;i<2;i++){rect(f,745+i*113,310,94,105,'#8d9ca5');for(let r=0;r<3;r++){rect(f,751+i*113,317+r*31,82,26,'#d4d9d4');rect(f,781+i*113,325+r*31,22,4,'#74848d')}block(745+i*113,310,94,105)}
 for(let i=0;i<3;i++)block(735+i*83,height-190,68,120);
 rect(f,745,height-45,200,25,'#ded9be');plant(f,965,285);
 for(const a of agents){a.path=[];a.x=seats[a.seat%capacity].x;a.y=seats[a.seat%capacity].y;a.destination='desk';a.node=null;}renderServers();renderAgents();
}
// Four-neighbour BFS on a 10px grid, expanded obstacles protect the sprite footprint.
function passable(x,y){return x>=20&&y>=40&&x<=980&&y<=height-20&&!obstacles.some(o=>x>o.x-10&&x<o.x+o.w+10&&y>o.y-10&&y<o.y+o.h+10)}
function nearest(point){let best=null,dist=Infinity;for(let y=40;y<=height-20;y+=10)for(let x=20;x<=980;x+=10){if(!passable(x,y))continue;const d=Math.abs(x-point.x)+Math.abs(y-point.y);if(d<dist){dist=d;best={x,y}}}return best}
function findPath(start,target){const a=nearest(start),b=nearest(target);if(!a||!b)return [];const key=p=>p.x+','+p.y,q=[a],seen=new Map([[key(a),null]]);let end=null;for(let i=0;i<q.length;i++){const p=q[i];if(key(p)===key(b)){end=p;break}for(const [dx,dy]of [[10,0],[-10,0],[0,10],[0,-10]]){const n={x:p.x+dx,y:p.y+dy},k=key(n);if(passable(n.x,n.y)&&!seen.has(k)){seen.set(k,p);q.push(n)}}}if(!end)return [];const result=[];while(end){result.push(end);end=seen.get(key(end))}return result.reverse()}
function destination(a,kind){let target=seats[a.seat];if(kind==='library')target={x:800,y:225};if(kind==='sofa')target={x:155,y:height-140};if(kind==='wander')target={x:50+Math.random()*600,y:40+Math.random()*(height-80)};a.path=findPath(a,target);a.destination=kind;a.wait=0;if(a.path.length){a.x=a.path[0].x;a.y=a.path[0].y;}if(selected===a.id)details()}
function human(a){const g=svg('g',{'class':'agent','tabindex':0,'role':'button','aria-label':a.name},$('people'));svg('ellipse',{cx:0,cy:2,rx:17,ry:5,fill:'#36454c',opacity:.16},g);rect(g,-17,-51,34,58,'transparent',{'class':'selection',rx:5});
 const body=svg('g',{'class':'body'},g);rect(body,-10,-23,20,22,a.color);rect(body,-10,-1,7,10,'#3d495a',{'class':'leg left'});rect(body,3,-1,7,10,'#3d495a',{'class':'leg right'});
 const headPlacement=svg('g',{'class':'head-placement'},g);const head=svg('g',{'class':'head'},headPlacement);rect(head,-13,-46,26,24,'#e7bb92');rect(head,-15,-49,30,10,a.hair);rect(head,-15,-43,5,12,a.hair);rect(head,10,-43,5,12,a.hair);rect(head,-8,-34,3,4,'#303747');rect(head,5,-34,3,4,'#303747');rect(head,-3,-26,6,2,'#a57564');
 rect(g,-15,-15,9,5,'#e7bb92',{'class':'paw left'});rect(g,6,-15,9,5,'#e7bb92',{'class':'paw right'});const book=svg('g',{'class':'book',visibility:'hidden'},g);rect(book,-15,-19,14,14,'#fff0ca');rect(book,0,-19,14,14,'#eadcb6');rect(book,-1,-19,2,15,'#997553');a.badge=text(g,25,-45,'',18);a.nameNode=text(g,0,28,a.name,10);g.addEventListener('click',()=>select(a.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(a.id)}});a.node=g;return g}
function renderAgents(){for(const a of agents){if(!a.node)human(a);const seated=!a.path.length&&a.destination==='desk';const resting=!a.path.length&&a.destination==='sofa';a.node.setAttribute('transform',`translate(${a.x} ${a.y})`);a.node.setAttribute('class',`agent ${selected===a.id?'selected':''} ${seated&&['writing','executing','replying'].includes(a.state)?'typing':''} ${resting?'resting':''} ${a.state==='done'?'happy':''} ${['anxious','error'].includes(a.state)?'anxious':''}`);a.node.querySelector('.book').setAttribute('visibility',!a.path.length&&a.destination==='library'?'visible':'hidden');a.node.querySelector('.body').setAttribute('visibility',seated?'hidden':'visible');a.node.querySelectorAll('.paw').forEach(n=>n.setAttribute('visibility',seated&&['writing','executing','replying'].includes(a.state)?'visible':'hidden'));
 // Desk seat head is above the screen; the torso is occluded, not standing on furniture.
 a.node.querySelector('.head-placement').setAttribute('transform',seated?'translate(0 35)':'');a.node.querySelectorAll('.paw').forEach(n=>n.setAttribute('y',seated?45:-15));
 a.badge.setAttribute('y',seated?-20:-45);a.nameNode.setAttribute('y',seated?85:28);
 a.badge.textContent=a.path.length?'→':resting?'z':({thinking:'?',researching:'?',anxious:'!',blocked:'…',error:'!',done:'✦',idle:'·',syncing:'↻'}[a.state]||'');
 if(a.path.length){const stride=Math.floor(performance.now()/160)%2;a.node.querySelector('.leg.left').setAttribute('y',stride?2:-1);a.node.querySelector('.leg.right').setAttribute('y',stride?-1:2);}}
 $('routes').replaceChildren();const a=agents.find(a=>a.id===selected);if(showPaths&&a&&a.path.length)svg('polyline',{points:[{x:a.x,y:a.y},...a.path].map(p=>p.x+','+p.y).join(' '),'class':'route'},$('routes'));}
const services=new Map();
function renderServers(){const root=$('servers');root.replaceChildren();for(let i=0;i<3;i++){const data=[...services.values()][i]||{name:'服务器 '+(i+1),load:null,status:'unknown'},x=735+i*83,y=height-190,busy=data.load!==null&&data.load>=81;const g=svg('g',{},root);rect(g,x,y,68,120,'#43526a');rect(g,x+4,y+4,60,112,'#29394e');for(let r=0;r<5;r++){rect(g,x+8,y+9+r*18,52,13,'#53657a');rect(g,x+12,y+13+r*18,4,4,data.status==='down'?'#df7b6b':data.load===null?'#9babb7':'#8fca83',{'class':data.load?'lamp':''})}rect(g,x+8,y+103,52,8,'#79818b');if(data.load!==null)rect(g,x+9,y+104,Math.max(1,50*data.load/100),6,busy?'#dd8272':'#8ac487');text(g,x+34,y-12,(data.load===null?(data.status==='up'?'在线 · 负载未知':'负载未知'):data.load+'%'),10);text(g,x+34,y+140,data.name.slice(0,10),9);if(busy)for(let j=0;j<3;j++)svg('circle',{cx:x+16+j*17,cy:y-22,r:5,fill:'#f5f5e8',class:'smoke',style:`animation-delay:${j*.4}s`},g)}}
function addAgent(id,name,seat,state='idle'){const a={id,name,seat,color:palette[seat%palette.length],hair:['#3f3433','#6e4833','#273b48'][seat%3],state,task:'尚未上报任务',step:'等待任务',progress:null,history:[],path:[],destination:'desk',wait:0,...seats[seat]};agents.push(a);renderAgents();return a}
function select(id){selected=id;details();renderAgents()}
function details(){const a=agents.find(x=>x.id===selected);if(!a)return;$('name').textContent=a.name;$('status').textContent=a.path.length?'沿通道行走':a.destination==='sofa'?'沙发休息':labels[a.state]||a.state;$('task').textContent=a.task;$('step').textContent=a.step;$('progress').hidden=a.progress===null;$('progress').value=a.progress||0;$('percent').textContent=a.progress===null?'进度未上报':a.progress+'%';$('history').replaceChildren();for(const item of a.history.slice(-6)){const li=document.createElement('li');li.textContent=item;$('history').append(li)}}
function demo(){mode='demo';agents=[];$('people').replaceChildren();services.clear();['闲置','正常','繁忙'].forEach((n,i)=>services.set(n,{name:n,load:[8,46,92][i],status:'up'}));['林舟','许言','苏禾','程远','沈宁','顾安'].forEach((n,i)=>{if(i>=capacity)return;const a=addAgent('demo-'+i,n,i,['writing','anxious','done','thinking','researching','idle'][i]);a.task=['整理季度经营报告','排查数据同步异常','完成接口测试','设计数据校验规则','查阅归档资料','等待下一项任务'][i];a.step='演示行为 · 未接入真实任务';a.progress=i===0?68:null;a.history=['09:32 接收任务','09:35 查阅资料','09:41 处理任务'];if(i===4)destination(a,'library');if(i===5)destination(a,'sofa')});select('demo-0');renderServers();modeUI()}
function modeUI(){$('live').classList.toggle('active',mode==='live');$('demo').classList.toggle('active',mode==='demo');$('modeLabel').textContent=mode==='demo'?'演示模式 · 所有任务与负载均为模拟数据':'实时模式 · 未上报的进度与负载保持未知';$('add').disabled=mode!=='demo'}
function event(e){if(mode!=='live')return;if(e.type==='state'||e.type==='task'){const id=e.type==='state'?String(e.subject||'me'):String(e.agent_id||'me');let a=agents.find(a=>a.id===id);if(!a){if(agents.length>=capacity){$('notice').textContent='工位已满，请增加工位以展示更多角色';return}a=addAgent(id,e.agent_name||id,agents.length)}a.state=e.status==='running'?'executing':e.status==='failed'?'error':e.status;a.task=e.summary||a.task;a.step=e.detail||e.summary||labels[a.state]||a.state;a.progress=Number.isFinite(e.progress)?Math.max(0,Math.min(100,e.progress)):null;a.history.push(new Date(e.ts).toLocaleTimeString('zh-CN')+' '+a.step);destination(a,a.state==='researching'?'library':'desk');if(!selected)selected=id;details()}
 if(e.type==='heartbeat'||e.type==='process'||e.type==='service'){services.set(e.subject,{name:e.subject,status:e.status,load:Number.isFinite(e.load)?Math.max(0,Math.min(100,e.load)):null});renderServers()}
 const div=document.createElement('div');div.textContent=(e.subject||'')+' · '+(e.summary||e.status);$('feed').prepend(div);while($('feed').children.length>30)$('feed').lastChild.remove();}
async function connect(){clearTimeout(reconnect);try{const r=await fetch('/api/town-snapshot');if(!r.ok)throw Error();const snap=await r.json();if(mode==='live'){Object.values(snap.entities||{}).sort((a,b)=>a.seq-b.seq).forEach(event);if(!snap.entities)(snap.events||[]).slice().reverse().forEach(event)}lastSeq=Math.max(lastSeq,snap.seq||0)}catch{$('connection').textContent='快照不可用 · 等待事件流'}if(source)source.close();source=new EventSource('/api/town-events?after='+lastSeq);source.onopen=()=>$('connection').textContent='实时事件已连接';source.onmessage=m=>{try{const e=JSON.parse(m.data);if(e.seq<=lastSeq)return;lastSeq=e.seq;event(e)}catch{}};source.onerror=()=>{$('connection').textContent='连接中断 · 正在重试';source.close();reconnect=setTimeout(connect,5000)}}
$('demo').onclick=demo;$('live').onclick=()=>{mode='live';agents=[];selected=null;services.clear();$('people').replaceChildren();$('routes').replaceChildren();$('name').textContent='等待角色上报';$('status').textContent='未知';$('task').textContent='等待真实任务';$('step').textContent='—';$('history').replaceChildren();$('progress').hidden=true;$('percent').textContent='进度未上报';modeUI();renderServers();connect()};$('desks').onchange=()=>{const n=Number($('desks').value);if(n<agents.length){$('notice').textContent='工位数不能少于当前角色数';$('desks').value=capacity;return}capacity=n;rebuild()};$('add').onclick=()=>{if(agents.length>=capacity){$('notice').textContent='工位已满，请先增加工位';return}const a=addAgent('demo-'+Date.now(),'同事 '+(agents.length+1),agents.length);a.task='演示 · 等待任务';select(a.id)};$('paths').onclick=()=>{showPaths=!showPaths;$('paths').textContent=showPaths?'隐藏路线':'显示路线';$('paths').setAttribute('aria-pressed',showPaths);renderAgents()};$('follow').onclick=()=>{showPaths=true;$('paths').textContent='隐藏路线';$('paths').setAttribute('aria-pressed','true');renderAgents()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续动画':'暂停动画';$('pause').setAttribute('aria-pressed',paused);$('map').style.visibility='visible';document.querySelectorAll('#map *').forEach(e=>e.style.animationPlayState=paused?'paused':'running')};
function frame(t){const dt=lastTime?Math.min((t-lastTime)/1000,.05):0;lastTime=t;if(!paused){for(const a of agents){if(a.path.length){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),step=70*dt;if(d<=step){a.x=p.x;a.y=p.y;a.path.shift();if(!a.path.length){if(a.destination==='desk'){Object.assign(a,seats[a.seat])}if(a.destination==='sofa'){a.x=155;a.y=height-75;}a.wait=0;if(a.id===selected)details()}}else{a.x+=dx/d*step;a.y+=dy/d*step}}else if(a.state==='idle'){a.wait+=dt;if(a.wait>12)destination(a,a.destination==='sofa'?'wander':Math.random()<.5?'sofa':'wander')}else if(mode==='demo'&&a.state==='researching'){a.wait+=dt;if(a.wait>15){a.state='writing';a.step='查阅完成，返回工位整理';destination(a,'desk')}}}renderAgents();if(reducedMotion)document.querySelectorAll('#map *').forEach(e=>e.style.animation='none')}requestAnimationFrame(frame)}
rebuild();modeUI();connect();requestAnimationFrame(frame);setInterval(()=>$('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}),1000);
