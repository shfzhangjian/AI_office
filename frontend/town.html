function passable(x,y){return x>=20&&y>=40&&x<=980&&y<=height-20&&!obstacles.some(o=>x>o.x-10&&x<o.x+o.w+10&&y>o.y-10&&y<o.y+o.h+10)}
function nearest(point){let best=null,dist=Infinity;for(let y=40;y<=height-20;y+=10)for(let x=20;x<=980;x+=10){if(!passable(x,y))continue;const d=Math.abs(x-point.x)+Math.abs(y-point.y);if(d<dist){dist=d;best={x,y}}}return best}
function findPath(start,target){const a=nearest(start),b=nearest(target);if(!a||!b)return [];const key=p=>p.x+','+p.y,q=[a],seen=new Map([[key(a),null]]);let end=null;for(let i=0;i<q.length;i++){const p=q[i];if(key(p)===key(b)){end=p;break}for(const [dx,dy]of [[10,0],[-10,0],[0,10],[0,-10]]){const n={x:p.x+dx,y:p.y+dy},k=key(n);if(passable(n.x,n.y)&&!seen.has(k)){seen.set(k,p);q.push(n)}}}if(!end)return [];const result=[];while(end){result.push(end);end=seen.get(key(end))}return result.reverse()}

  a.paperCount=Math.max(0,Math.min(12,a.paperCount+delta));

  delta=['done','archived','idle'].includes(e.status)?-1:['writing','executing','researching','receiving','replying','running'].includes(e.status)?1:0;

function addAgent(id,name,seat,state='idle'){const a={id,name,seat,color:palette[seat%palette.length],hair:['#3f3433','#6e4833','#273b48'][seat%3],state,paperCount:0,paperTasks:new Set(),lastPaperSeq:0,paperReason:'',task:'尚未上报任务',step:'等待任务',progress:null,history:[],path:[],destination:'desk',wait:0,...seats[seat]};agents.push(a);renderAgents();return a}

function modeUI(){$('live').classList.toggle('active',mode==='live');$('demo').classList.toggle('active',mode==='demo');$('add').disabled=mode!=='demo'}
const scheduleRuns=new Map();
const scheduleLabels={triggered:'已触发',running:'运行中',done:'已完成',failed:'失败',missed:'错过执行'};
function scheduleTime(value){if(!value)return '未上报';return new Date(value).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
function scheduleEvent(e,notify=true){
 if(!e.run_id)return;const old=scheduleRuns.get(e.run_id);
 if(old&&(old.seq||0)>=(e.seq||0))return;
 if(old&&['done','failed','missed'].includes(old.status)&&['triggered','running'].includes(e.status))return;
 const current={...old,...e,triggered_at:old?.triggered_at||e.triggered_at||(e.status==='triggered'?e.ts:null)};scheduleRuns.set(e.run_id,current);
 if(scheduleRuns.size>100)scheduleRuns.delete([...scheduleRuns.values()].sort((a,b)=>a.seq-b.seq)[0].run_id);
 renderSchedules();
 if(notify&&((e.status==='triggered'&&!old)||(['done','failed','missed'].includes(e.status)&&old?.status!==e.status)))scheduleToast(current);
}
function renderSchedules(){
 const items=[...scheduleRuns.values()].sort((a,b)=>b.seq-a.seq),active=items.filter(e=>['triggered','running'].includes(e.status)).length;
 $('scheduleCount').textContent=active?active+' 运行':String(items.length);$('scheduleToggle').classList.toggle('has-running',active>0);$('scheduleDemo').hidden=mode!=='demo';$('scheduleMode').textContent=(mode==='demo'?'演示记录 · ':'最近 100 次运行 · ')+'时间按北京时间显示';

 for(const e of items){const row=document.createElement('article');row.className='schedule-run';const h=document.createElement('h3');h.textContent=e.job_name||e.subject;row.append(h);const status=document.createElement('span');status.className='schedule-result '+e.status;status.textContent=scheduleLabels[e.status]||e.status;row.append(status);
  for(const value of ['计划时间：'+scheduleTime(e.scheduled_for),'触发时间：'+scheduleTime(e.triggered_at||(e.status==='triggered'?e.ts:null)),e.finished_at?'结束时间：'+scheduleTime(e.finished_at):'',e.summary||e.detail||'','运行 ID：'+e.run_id])if(value){const p=document.createElement('p');p.textContent=value;row.append(p)}
  if(e.agent_id){const b=document.createElement('button');b.textContent='查看执行角色';b.onclick=()=>{if(agents.some(a=>a.id===e.agent_id)){closeSchedules();select(e.agent_id)}else $('notice').textContent='此角色尚未上报工作状态'};row.append(b)}list.append(row);
 }
}
function openSchedules(){$('scheduleToasts').replaceChildren();$('inspector').hidden=true;$('schedulePanel').hidden=false;$('scheduleToggle').setAttribute('aria-expanded','true');renderSchedules();$('scheduleClose').focus?.()}
function closeSchedules(){$('schedulePanel').hidden=true;$('scheduleToggle').setAttribute('aria-expanded','false');$('scheduleToggle').focus?.()}
function scheduleToast(e){const box=$('scheduleToasts');while(box.children.length>=4)box.children[0].remove();const toast=document.createElement('div');toast.className='schedule-toast '+e.status;const body=document.createElement('div');const title=document.createElement('strong');title.textContent='◷ '+(e.job_name||e.subject)+' · '+(scheduleLabels[e.status]||e.status);body.append(title);const detail=document.createElement('p');detail.textContent=e.summary||'计划任务已由调度器触发';body.append(detail);const view=document.createElement('button');view.className='toast-detail';view.textContent='查看触发记录';view.onclick=()=>{openSchedules();toast.remove()};body.append(view);const close=document.createElement('button');close.setAttribute('aria-label','关闭任务通知');close.textContent='×';close.onclick=()=>toast.remove();toast.append(body,close);box.append(toast);setTimeout(()=>toast.remove(),8000)}
$('scheduleToggle').onclick=()=>$('schedulePanel').hidden?openSchedules():closeSchedules();$('scheduleClose').onclick=closeSchedules;
let demoScheduleSeq=0;
$('scheduleDemo').onclick=()=>{const run='demo-'+Date.now();scheduleEvent({type:'schedule',subject:'demo-daily-report',job_name:'日报汇总（演示）',run_id:run,status:'triggered',ts:new Date().toISOString(),scheduled_for:new Date().toISOString(),summary:'模拟定时触发，不会执行真实命令',seq:++demoScheduleSeq});setTimeout(()=>{if(mode==='demo')scheduleEvent({type:'schedule',subject:'demo-daily-report',run_id:run,status:'done',finished_at:new Date().toISOString(),ts:new Date().toISOString(),summary:'演示任务完成',seq:++demoScheduleSeq})},3000)};
function event(e){if(mode!=='live')return;if(e.type==='schedule'){scheduleEvent(e);return;}if(['log','document','note'].includes(e.type)&&e.agent_id){let owner=agents.find(a=>a.id===String(e.agent_id));if(!owner&&agents.length<capacity)owner=addAgent(String(e.agent_id),e.agent_name||String(e.agent_id),agents.length);if(owner)paperEvent(owner,e);}if(e.type==='agent'){let a=agents.find(a=>a.id===e.subject);if(!a&&agents.length<capacity)a=addAgent(e.subject,e.agent_name||e.subject,agents.length);if(a){a.name=e.agent_name||a.name;a.node?.setAttribute('aria-label',a.name);renderAgents()}return;}if(e.type==='state'||e.type==='task'){const id=e.type==='state'?String(e.subject||'me'):String(e.agent_id||'me');let a=agents.find(a=>a.id===id);if(!a){if(agents.length>=capacity){$('notice').textContent='工位已满，请增加工位以展示更多角色';return}a=addAgent(id,e.agent_name||id,agents.length)}a.identity={...a.identity,...Object.fromEntries(['provider','robot_code','conversation_type','conversation_id','executor_id'].filter(k=>e[k]).map(k=>[k,e[k]]))};paperEvent(a,e);a.name=e.agent_name||a.name;a.node?.setAttribute('aria-label',a.name);a.state=e.status==='running'?'executing':e.status==='failed'?'error':e.status;a.task=e.summary||a.task;a.step=e.detail||e.summary||labels[a.state]||a.state;a.progress=Number.isFinite(e.progress)?Math.max(0,Math.min(100,e.progress)):null;a.history.push(new Date(e.ts).toLocaleTimeString('zh-CN')+' '+a.step);destination(a,a.state==='researching'?'library':'desk');if(!selected)selected=id;details()}
 if(e.type==='heartbeat'||e.type==='process'||e.type==='service'){services.set(e.subject,{name:e.subject,status:e.status,load:Number.isFinite(e.load)?Math.max(0,Math.min(100,e.load)):null});renderServers()}
 const div=document.createElement('div');div.textContent=(e.subject||'')+' · '+(e.summary||e.status);$('feed').prepend(div);while($('feed').children.length>30)$('feed').lastChild.remove();}
function restoreAgents(snap){
 for(const record of Object.values(snap.agents||{})){
  let a=agents.find(a=>a.id===record.id),created=!a;if(!a){if(agents.length>=capacity){$('notice').textContent='工位已满，请增加工位显示其余真实角色';continue;}a=addAgent(record.id,record.name||record.id,agents.length);}
  a.identity=record;const changed=a.state!==record.state;a.name=record.name||record.id;a.state=record.state;a.task=record.task||'等待任务';a.step=record.detail||labels[a.state]||a.state;a.progress=Number.isFinite(record.progress)?record.progress:null;
  a.paperCount=record.documents_count||0;a.paperTasks=new Set(Object.keys(record.pending_tasks||{}));a.lastPaperSeq=record.seq||0;a.paperReason='已从持久化快照恢复';a.history=(record.history||[]).map(h=>new Date(h.ts).toLocaleTimeString('zh-CN')+' '+h.summary);renderPapers(a);
  if(created||changed)destination(a,a.state==='researching'?'library':'desk');if(!selected)selected=a.id;
 }

}
async function connect(){clearTimeout(reconnect);try{const r=await fetch('/api/town-snapshot');if(!r.ok)throw Error();const snap=await r.json();if(mode==='live'){for(const e of snap.schedules||[])scheduleEvent(e,false);if(snap.agents){restoreAgents(snap);Object.values(snap.entities||{}).filter(e=>['service','heartbeat','process'].includes(e.type)).sort((a,b)=>a.seq-b.seq).forEach(event);}else{Object.values(snap.entities||{}).sort((a,b)=>a.seq-b.seq).forEach(event);if(!snap.entities)(snap.events||[]).slice().reverse().forEach(event)}}lastSeq=Math.max(lastSeq,snap.seq||0)}catch{$('connection').textContent='快照不可用 · 等待事件流'}if(source)source.close();source=new EventSource('/api/town-events?after='+lastSeq);source.onopen=()=>$('connection').textContent=mode==='demo'?'布局预览 · 模拟数据':'实时事件已连接';source.onmessage=m=>{try{const e=JSON.parse(m.data);if(e.seq<=lastSeq)return;lastSeq=e.seq;event(e)}catch{}};source.onerror=()=>{$('connection').textContent='连接中断 · 正在重试';source.close();reconnect=setTimeout(connect,5000)}}
$('toCoffee').onclick=()=>{const a=agents.find(a=>a.id===selected);if(mode==='demo'&&a?.state==='idle')destination(a,'coffee')};$('toGaming').onclick=()=>{const a=agents.find(a=>a.id===selected);if(mode==='demo'&&a?.state==='idle'){destination(a,'sofa');a.requestedRest='gaming'}};$('closeDetails').onclick=()=>{$('inspector').hidden=true;const a=agents.find(a=>a.id===selected);a?.node.focus?.()};document.addEventListener?.('keydown',e=>{if(e.key==='Escape'){$('inspector').hidden=true;closeSchedules()}});$('demo').onclick=demo;$('live').onclick=()=>{mode='live';scheduleRuns.clear();$('scheduleToasts').replaceChildren();renderSchedules();$('inspector').hidden=true;agents=[];selected=null;services.clear();$('people').replaceChildren();$('routes').replaceChildren();$('name').textContent='等待角色上报';$('status').textContent='未知';$('task').textContent='等待真实任务';$('step').textContent='—';$('history').replaceChildren();$('progress').hidden=true;$('percent').textContent='进度未上报';modeUI();renderServers();connect()};$('desks').onchange=()=>{const n=Number($('desks').value);if(n<agents.length){$('notice').textContent='工位数不能少于当前角色数';$('desks').value=capacity;return}capacity=n;rebuild()};$('add').onclick=()=>{if(agents.length>=capacity){$('notice').textContent='工位已满，请先增加工位';return}const a=addAgent('demo-'+Date.now(),'同事 '+(agents.length+1),agents.length);a.task='演示 · 等待任务';select(a.id)};$('paths').onclick=()=>{showPaths=!showPaths;$('paths').textContent=showPaths?'隐藏路线':'显示路线';$('paths').setAttribute('aria-pressed',showPaths);renderAgents()};$('follow').onclick=()=>{showPaths=true;$('paths').textContent='隐藏路线';$('paths').setAttribute('aria-pressed','true');renderAgents()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续动画':'暂停动画';$('pause').setAttribute('aria-pressed',paused);$('map').style.visibility='visible';document.querySelectorAll('#map *').forEach(e=>e.style.animationPlayState=paused?'paused':'running')};
function frame(t){const dt=lastTime?Math.min((t-lastTime)/1000,.05):0;lastTime=t;if(!paused){for(const a of agents){if(a.path.length){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),step=70*dt;if(d<=step){a.x=p.x;a.y=p.y;a.path.shift();if(!a.path.length){if(a.destination==='desk'){Object.assign(a,seats[a.seat])}if(a.destination==='sofa'){a.x=165;a.y=height-60;a.restActivity=a.requestedRest|| (Math.random()<.65?'gaming':'resting');a.requestedRest=null;}if(a.destination==='coffee'){a.x=500;a.y=height-38;a.restActivity='coffee';}a.wait=0;if(a.id===selected)details()}}else{a.x+=dx/d*step;a.y+=dy/d*step}}else if(a.state==='idle'){a.wait+=dt;if(a.wait>(['sofa','coffee'].includes(a.destination)?24:12))destination(a,chooseRest(a))}else if(mode==='demo'&&a.state==='researching'){a.wait+=dt;if(a.wait>15){a.state='writing';a.step='查阅完成，返回工位整理';destination(a,'desk')}}}renderAgents();if(reducedMotion)document.querySelectorAll('#map *').forEach(e=>e.style.animation='none')}requestAnimationFrame(frame)}
